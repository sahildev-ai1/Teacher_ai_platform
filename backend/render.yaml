# Render Blueprint for the backend. Deploy with "New + > Blueprint" and point
# it at this repo, or configure a Web Service manually using these settings.
services:
  - type: web
    name: teacher-ai-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # --workers 1 is deliberate: a free instance (512MB RAM) cannot safely run
    # multiple uvicorn workers once the embedding model is loaded in each.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud
      - key: OLLAMA_FAST_MODEL
        value: gemma4:cloud
      - key: TAVILY_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
        value: ""  # optional -- see backend/.env.example
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.onrender.com
      - key: SQLITE_PATH
        value: /opt/render/project/data/tkp.db
      - key: UPLOAD_DIR
        value: /opt/render/project/data/uploads
      - key: EXPORT_DIR
        value: /opt/render/project/data/exports
